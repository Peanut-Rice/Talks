<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>让 AI 帮你理解：从文字到认知工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033}
header{padding:42px 24px 30px;max-width:1120px;margin:auto}
h1{font-size:34px;margin:0 0 12px;letter-spacing:-1px}
.sub{font-size:17px;color:#657084;line-height:1.7;max-width:850px}
main{max-width:1120px;margin:auto;padding:0 24px 60px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
button{border:0;border-radius:10px;padding:11px 15px;background:#e7ebf3;color:#354056;cursor:pointer;font-size:14px}
button.active{background:#172033;color:white}
.card{background:white;border:1px solid #e4e8f0;border-radius:18px;padding:25px;box-shadow:0 8px 28px #1a254010;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
h2{font-size:22px;margin:0 0 16px}
h3{font-size:16px;margin:0 0 10px}
p{line-height:1.8}
.quote{background:#f7f8fa;border-left:4px solid #64748b;padding:15px 18px;border-radius:8px;line-height:1.9}
.ste p{margin:8px 0}.ste p span{display:inline-block;margin-right:5px}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}
.node{padding:17px 12px;border-radius:14px;background:#f0f3f8;text-align:center;cursor:pointer}
.node b{display:block;margin-bottom:7px}.node small{color:#697386}
.node.selected{outline:3px solid #172033;background:#fff}
.detail{min-height:130px}
.bar{height:10px;background:#e8ecf2;border-radius:8px;overflow:hidden;margin:8px 0 14px}
.fill{height:100%;background:#172033;border-radius:8px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi div{background:#f7f8fa;padding:16px;border-radius:12px}.kpi strong{font-size:25px;display:block}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}
.flow .box{padding:14px 18px;border-radius:12px;background:#eef2f7}.arrow{font-size:22px;color:#8290a5}
textarea{width:100%;min-height:115px;border:1px solid #d8dee9;border-radius:12px;padding:14px;font:inherit;line-height:1.6}
.output{margin-top:12px;background:#111827;color:#e8edf5;border-radius:12px;padding:18px;line-height:1.8;white-space:pre-wrap}
.prompt{background:#eef2ff;padding:15px;border-radius:12px;line-height:1.7}
@media(max-width:760px){.grid,.kpi{grid-template-columns:1fr}.pipeline{grid-template-columns:1fr 1fr}h1{font-size:28px}}
</style>
</head>
<body>
<header>
<h1>让 AI 帮你搞懂一件事</h1>
<div class="sub">一个小型认知实验：当 AI 越来越擅长生成内容，人类真正需要的可能不是“更多答案”，而是更低成本地理解答案。</div>
</header>
<main>
<div class="tabs" id="tabs"></div>

<section class="card" id="content"></section>

<section class="card">
<h2>自己试一下：把你的问题“编译”成容易理解的版本</h2>
<p>输入一个你最近觉得“看懂了，但其实没完全搞懂”的概念。下面的模拟器会用接近 ASD-STE100 的规则，把它拆成短句、单一动作和明确关系。</p>
<textarea id="input" placeholder="例如：为什么企业 AI 要从应用建设走向能力建设？"></textarea>
<button style="margin-top:10px" onclick="simplify()">生成可理解版本</button>
<div id="out" class="output">等待输入……</div>
</section>

<section class="card">
<h2>核心变化</h2>
<div class="flow">
<div class="box">AI 生成答案</div><div class="arrow">→</div>
<div class="box">AI 组织信息</div><div class="arrow">→</div>
<div class="box">AI 设计理解工具</div><div class="arrow">→</div>
<div class="box">人负责判断</div>
</div>
<div class="kpi">
<div><strong>Text</strong>表达答案</div>
<div><strong>Diagram</strong>展示关系</div>
<div><strong>Interactive</strong>帮助探索</div>
</div>
</section>
</main>

<script>
const data=[
["01","普通文字","AI先写一篇文章","最容易生成，但也最容易出现“听起来懂了”的错觉。",
`随着大模型能力不断增强，AI 正在从单纯的内容生成工具转变为能够自主完成复杂任务的智能系统。用户工作的重心也将逐渐从直接执行转向对 AI 输出进行监督、理解和判断。`,
"信息量","中等","理解成本","高"],
["02","ASD-STE","把复杂思想变成短句","ASD-STE100 的价值不只是“英语写得简单”，而是强迫表达者减少歧义。",
`AI 可以帮助人完成任务。\nAI 可以访问系统。\nAI 可以使用工具。\nAI 可以检查工具的结果。\n如果结果不满足目标，AI 可以再次执行。\n人负责设定目标。\n人负责关键判断。\n人负责最终责任。`,
"歧义","低","阅读成本","低"],
["03","Diagram","把关系画出来","图不是文章的装饰。它可以把“谁做什么、先后关系、循环关系”直接变成视觉结构。",
`目标 → 计划 → 选择工具 → 执行动作 → 检查结果\n                 ↑                 ↓\n                 └──── 需要重试 ────┘`,
"结构可见性","高","扫描成本","低"],
["04","Interactive Web","让人自己探索","当概念存在多个变量时，静态文章不够。一个小网页可以让读者改变参数、观察结果。",
`把“AI 能做什么”变成可以点击的东西。\n把“为什么会这样”变成可以改变参数的问题。\n把“结论”变成可以自己验证的实验。`,
"参与度","高","验证成本","低"],
["05","Explainer Video","让 AI 设计理解过程","视频、动画和模拟可以把时间关系、因果关系和抽象机制变成连续过程。",
`不是让 AI 再写一篇文章。\n而是让 AI 决定：先展示什么，再展示什么。\n让 AI 设计一个最适合人理解这个概念的解释过程。`,
"表达能力","很高","制作成本","正在下降"]
];

const tabs=document.getElementById("tabs"), content=document.getElementById("content");
data.forEach((d,i)=>{let b=document.createElement("button");b.textContent=d[0]+" "+d[1];b.onclick=()=>show(i);tabs.appendChild(b)});
function show(i){
 document.querySelectorAll(".tabs button").forEach((b,j)=>b.classList.toggle("active",i===j));
 let d=data[i];
 content.innerHTML=`<h2>${d[1]}：${d[2]}</h2>
 <p>${d[3]}</p>
 <div class="grid">
 <div><h3>示例</h3><div class="quote ${i===1?'ste':''}">${d[4].replace(/\n/g,"<br>")}</div></div>
 <div><h3>它改变了什么？</h3>
 <p><b>${d[5]}：</b>${d[6]}</p><div class="bar"><div class="fill" style="width:${[55,25,20,12,8][i]}%"></div></div>
 <p><b>${d[7]}：</b>${d[8]}</p><div class="bar"><div class="fill" style="width:${[78,28,22,15,10][i]}%"></div></div>
 </div></div>`;
}
show(0);

function simplify(){
 const x=document.getElementById("input").value.trim();
 if(!x){document.getElementById("out").textContent="请先输入一个概念。";return}
 let s=x.replace(/[，；。]/g,"。").split("。").filter(Boolean);
 let lines=[];
 lines.push("目标：理解“"+x+"”。");
 lines.push("");
 lines.push("先问三个问题：");
 lines.push("1. 它是什么？");
 lines.push("2. 它解决什么问题？");
 lines.push("3. 它怎样工作？");
 lines.push("");
 lines.push("表达规则：");
 lines.push("• 一句话只表达一个主要动作。");
 lines.push("• 一个概念尽量使用同一个名称。");
 lines.push("• 不用没有必要的抽象词。");
 lines.push("• 把事实、判断和假设分开。");
 lines.push("• 如果存在因果关系，明确写出“因为”和“所以”。");
 lines.push("");
 lines.push("下一步：把这个概念做成一张图。");
 lines.push("再下一步：把这张图做成可以点击和操作的网页。");
 document.getElementById("out").textContent=lines.join("\n");
}
</script>
</body>
</html>
