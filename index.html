<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talks · 文档索引</title>
  <meta name="description" content="AI 学习记录与方案文档的索引：按日期、类别和一句话说明列出每份文档。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div class="page">

    <header class="masthead">
      <h1 class="display"><span>Talks</span></h1>
      <p class="lede">AI 学习记录与方案文档。每份文档按日期、类别和一句话说明列在下面。</p>
      <div class="masthead-meta">
        <span class="label"><span data-count>0</span> 份文档</span>
        <span class="label">最近更新 <span data-latest>—</span></span>
        <a class="link" href="https://github.com/Peanut-Rice/Talks" target="_blank" rel="noreferrer">github.com/Peanut-Rice/Talks</a>
      </div>
    </header>

    <div class="filters">
      <span class="label filters-label">类别</span>
      <div class="filters-pills" data-filters role="group" aria-label="按类别筛选"></div>
      <p class="label filters-count" data-count-line>共 0 份</p>
    </div>

    <p class="empty" data-empty hidden>这一类暂时没有文档。</p>

    <noscript>
      <p class="empty" style="padding-bottom:1.5rem">
        索引由浏览器脚本生成。若脚本被禁用，可直接打开仓库
        <a class="link" href="https://github.com/Peanut-Rice/Talks">Peanut-Rice/Talks</a> 查看全部文档。
      </p>
    </noscript>

    <nav aria-label="文档索引"><ul class="index" data-index></ul></nav>

    <footer class="site-foot">
      <span>Talks · 底层逻辑不变，表达层在进化</span>
      <a class="link" href="https://github.com/Peanut-Rice/Talks" target="_blank" rel="noreferrer">Peanut-Rice/Talks</a>
    </footer>
    <span class="wordmark" aria-hidden="true">Talks</span>

  </div>

  <script>
  (function () {
    'use strict';

    /* 索引的唯一数据源：新增文档只改这里。 */
    var DOCS = [
      {
        file: 'ai_understanding_tool.html',
        title: 'AI 的下一步 · 从生成答案到生成理解工具',
        desc: '学习笔记：AI 产出正从“答案”变成“认知工具”，理解成为新瓶颈——ASD-STE100 改写对照、“应用 vs 能力”图示、应用数量 × 复用程度交互实验',
        date: '2026-10-03',
        kind: '学习笔记',
        badge: 'NEW'
      },
      {
        file: 'e-work-intro.html',
        title: 'E-Work · 你的 AI 同事',
        desc: '集团内网 AI 智能助手使用手册：三种工作方式、六项核心技能、addoil 出错兜底机制',
        date: '2026-08-13',
        kind: '使用手册',
        badge: 'NEW'
      },
      {
        file: 'AI-Architecture.html',
        title: '金控集团 · AI 架构',
        desc: '智能化办公能力架构：模型网关五维能力、指标数据发布平台、MCP-指标库四类能力组',
        date: '2026-07-27',
        kind: '架构设计'
      },
      {
        file: 'workflow-to-agent.html',
        title: '从 Workflow 到 Agent · 企业 AI 应用的范式转移',
        desc: '企业 AI 从流程编排到自主决策的能力跃迁：Agent Runtime 承载业务知识、工具与领域 Skill',
        date: '2026-07-13',
        kind: '方案讨论'
      },
      {
        file: 'AI-Engineering.html',
        title: 'AI Engineering · Prompt → Context → Harness → Loop',
        desc: '大模型应用的四次能力升维：Prompt → Context → Harness → Loop，智能增益的演进路径',
        date: '2026-07-13',
        kind: '架构推演',
        badge: 'NEW'
      },
      {
        file: 'AI-SE.html',
        title: 'AI 驱动软件研发机制 · 四区架构',
        desc: '四区协作模型：创造、审查、适配、部署——各司其职的研发能力分区',
        date: '2026-06-17',
        kind: '架构设计'
      },
      {
        file: 'AI-Audit-PPT.html',
        title: '大模型在审计条线的应用 · 金控集团',
        desc: '审计领域 AI 能力场景：13 页场景化呈现，覆盖数据采集到风险识别',
        date: '2026-07-27',
        kind: '交流材料'
      },
      {
        file: 'README.md',
        title: 'README',
        desc: '仓库说明文件：这份索引的维护方式与文档清单',
        date: '2026-07-27',
        kind: '索引'
      }
    ];

    var root = document.documentElement;
    var list = document.querySelector('[data-index]');
    var pills = document.querySelector('[data-filters]');
    var empty = document.querySelector('[data-empty]');
    var countLine = document.querySelector('[data-count-line]');
    var countHead = document.querySelector('[data-count]');
    var latestHead = document.querySelector('[data-latest]');

    /* 只有两份以上的类别才配当筛选器 */
    var kinds = [];
    DOCS.forEach(function (doc) {
      if (kinds.indexOf(doc.kind) === -1) kinds.push(doc.kind);
    });
    var counts = {};
    DOCS.forEach(function (doc) { counts[doc.kind] = (counts[doc.kind] || 0) + 1; });
    var filters = kinds.filter(function (kind) { return counts[kind] > 1; });

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    /* --- 索引条目 --- */
    var items = DOCS.map(function (doc) {
      var li = el('li', 'entry');
      var a = el('a', 'entry-link');
      a.href = doc.file;

      var top = el('div', 'entry-top');
      top.appendChild(el('span', 'label', doc.date));
      var right = el('span', 'label');
      right.appendChild(el('span', 'entry-kind', doc.kind));
      if (doc.badge) right.appendChild(document.createTextNode(' · ' + doc.badge));
      right.style.display = 'flex';
      right.style.gap = '0.75rem';
      top.appendChild(right);

      var title = el('div', 'entry-title', doc.title);

      a.appendChild(top);
      a.appendChild(title);
      a.appendChild(el('p', 'entry-desc', doc.desc));
      li.appendChild(a);
      li.dataset.kind = doc.kind;
      list.appendChild(li);
      return li;
    });

    /* --- 类别筛选：标签即控件 --- */
    var active = '全部';

    function tag(kind) {
      var b = el('button', 'pill', kind);
      b.type = 'button';
      b.dataset.kind = kind;
      b.setAttribute('aria-pressed', 'false');
      return b;
    }

    pills.appendChild(tag('全部'));
    filters.forEach(function (kind) { pills.appendChild(tag(kind)); });

    function apply(kind, replay) {
      active = kind;
      var shown = 0;

      items.forEach(function (li) {
        var match = kind === '全部' || li.dataset.kind === kind;
        li.classList.toggle('is-hidden', !match);
        if (!match) return;
        shown++;
        if (replay) {
          li.classList.remove('is-in');
          void li.offsetWidth;
        }
      });

      Array.prototype.forEach.call(pills.children, function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.kind === kind));
      });

      countLine.textContent = kind === '全部'
        ? '共 ' + shown + ' 份'
        : kind + ' · ' + shown + ' 份';
      empty.hidden = shown !== 0;
    }

    pills.addEventListener('click', function (event) {
      var button = event.target.closest('.pill');
      if (button && button.dataset.kind !== active) apply(button.dataset.kind, true);
    });

    /* --- 抬头统计 --- */
    countHead.textContent = String(DOCS.length);

    var dates = DOCS.map(function (d) { return d.date; }).sort();
    var oldest = dates[0];
    var newest = dates[dates.length - 1];
    latestHead.textContent = oldest.slice(0, 7) === newest.slice(0, 7)
      ? newest
      : oldest.slice(0, 7) + ' 至 ' + newest.slice(0, 7);

    /* --- 入场：站名从遮罩升起，条目按阅读顺序逐行落下 --- */
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var revealAll = function () {
      items.forEach(function (li) { li.classList.add('is-in'); });
    };

    if (reduce || !('IntersectionObserver' in window)) {
      revealAll();
      apply('全部', false);
    } else {
      var reveals = 0;
      var masthead = document.querySelector('.masthead');

      requestAnimationFrame(function () {
        masthead.classList.remove('is-revealing');
      });

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var li = entry.target;
          var step = reveals++ % 6;
          li.style.transitionDelay = step * 70 + 'ms';
          /* 标题与说明比它所在的行晚一拍落位 */
          window.setTimeout(function () {
            var parts = li.querySelectorAll('.entry-title, .entry-desc');
            Array.prototype.forEach.call(parts, function (node, i) {
              node.style.transitionDelay = step * 70 + (i + 1) * 90 + 'ms';
            });
          }, 60);
          li.classList.add('is-in');
          observer.unobserve(li);
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.1 });

      items.forEach(function (li) { observer.observe(li); });
      apply('全部', false);

      /* 签名动作之后的一个尾巴：页脚字标随滚动缓慢上浮、加深 */
      var mark = document.querySelector('.wordmark');
      var ticking = false;
      var drift = function () {
        ticking = false;
        var box = mark.getBoundingClientRect();
        var progress = Math.min(1, Math.max(0, 1 - box.top / window.innerHeight));
        mark.style.transform = 'translateY(' + ((1 - progress) * 40).toFixed(1) + 'px)';
        mark.style.opacity = (0.05 + progress * 0.06).toFixed(3);
      };

      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(drift);
      }, { passive: true });

      drift();
    }
  })();
  </script>
</body>
</html>
